[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morphpreserve"
version = "0.1.0"
description = "Evaluation pipeline for morphology-preserving ECG denoising (BW/EM/MA/PLI), aimed at preeclampsia-prediction preprocessing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "morphpreserve contributors" }]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
full = ["PyWavelets>=1.4", "wfdb>=4.0", "pandas>=1.5", "matplotlib>=3.5"]
test = ["pytest>=7.0"]

[project.scripts]
morphpreserve-eval = "morphpreserve.cli:main"

[tool.setuptools.packages.find]
include = ["morphpreserve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
